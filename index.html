<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Assistant (Grok)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .api-section, .chat-section, .voice-section {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
        }
        .chat-box {
            height: 250px;
            overflow-y: auto;
            background-color: #121212;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            text-align: left;
        }
        .message {
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 6px;
        }
        .user-msg { background-color: #2563eb; }
        .ai-msg { background-color: #333; }
        .system-msg { color: #888; font-style: italic; text-align: center; }
        
        .mic-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
        }
        .wave-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            height: 100px;
            opacity: 0.3; 
            transition: opacity 0.3s;
        }
        .wave-container.active {
            opacity: 1; 
        }
        .wave-container span {
            width: 12px;
            background-color: #eab308;
            border-radius: 10px;
            animation: wave 1.2s ease-in-out infinite;
        }
        .wave-container.speaking span {
            background-color: #ef4444; 
            animation-duration: 0.5s;
        }
        
        .wave-container span:nth-child(1) { animation-delay: -0.2s; height: 30px; }
        .wave-container span:nth-child(2) { animation-delay: -0.4s; height: 60px; }
        .wave-container span:nth-child(3) { animation-delay: -0.6s; height: 90px; }
        .wave-container span:nth-child(4) { animation-delay: -0.4s; height: 60px; }
        .wave-container span:nth-child(5) { animation-delay: -0.2s; height: 30px; }

        @keyframes wave {
            0%, 100% { transform: scaleY(0.2); }
            50% { transform: scaleY(1); }
        }

        button {
            padding: 20px 50px;
            border: none;
            border-radius: 50px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-mic {
            background-color: #eab308;
            color: black;
        }
        .btn-mic.listening {
            background-color: #ef4444;
            color: white;
        }
        
        #statusText {
            font-size: 20px;
            font-weight: bold;
            color: #eab308;
            min-height: 30px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="api-section">
        <h3>✅ AI Connected (Grok)</h3>
        <p>API Key is loaded and ready.</p>
    </div>

    <div class="chat-section">
        <div class="chat-box" id="chatBox">
            <div class="message system-msg">Tap the microphone and speak!</div>
        </div>
    </div>

    <div class="voice-section">
        <div id="statusText">Ready</div>
        <div class="mic-container">
            <div class="wave-container" id="waveContainer">
                <span></span><span></span><span></span><span></span><span></span>
            </div>
            <button class="btn-mic" id="micBtn">🎤 TAP TO SPEAK</button>
        </div>
    </div>
</div>

<script>
    // YOUR GROK API KEY IS ADDED HERE
    let apiKey = "xai-zjDSGocGeut2Cq3faBFFfjHD5apHMLgyGDDqWJXV3hRghbunOOuePOeq6UAgaubfKlbHz3H2Fq8iY9e4"; 
    let isListening = false;
    let recognition;

    const waveContainer = document.getElementById('waveContainer');
    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('statusText');

    function setStatus(msg) {
        statusText.innerText = msg;
        console.log("Status: " + msg);
    }

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.continuous = false;
        recognition.interimResults = true;

        recognition.onstart = function() {
            setStatus("Listening...");
            addMessage("System: Microphone started.", "system-msg");
        };

        recognition.onresult = function(event) {
            let interimTranscript = '';
            let finalTranscript = '';
            
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript;
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }
            
            if (interimTranscript) {
                waveContainer.classList.add('speaking');
                setStatus("Heard: " + interimTranscript);
            } else {
                waveContainer.classList.remove('speaking');
            }
            
            if (finalTranscript) {
                waveContainer.classList.remove('speaking');
                addMessage("You: " + finalTranscript, "user-msg");
                sendToGrok(finalTranscript);
            }
        };

        recognition.onerror = function(event) {
            if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                setStatus("MIC BLOCKED");
                addMessage("System: Chrome blocked the mic! Make sure you are on the GitHub Pages HTTPS link.", "system-msg");
            } else if (event.error === 'no-speech') {
                setStatus("Didn't hear anything");
                addMessage("System: Didn't hear anything. Try again.", "system-msg");
            } else {
                setStatus("Error: " + event.error);
                addMessage("System: Error - " + event.error, "system-msg");
            }
            stopListening();
        };

        recognition.onend = function() {
            if (isListening) {
                stopListening();
            }
        };
    } else {
        setStatus("Browser Not Supported");
        alert("Your browser does not support voice recognition.");
    }

    micBtn.addEventListener('click', function() {
        if (isListening) {
            recognition.stop();
            stopListening();
        } else {
            try {
                setStatus("Requesting Mic...");
                recognition.start();
                isListening = true;
                micBtn.innerText = "🔴 STOP";
                micBtn.classList.add('listening');
                waveContainer.classList.add('active');
            } catch (e) {
                setStatus("Error starting mic");
                addMessage("System: Error starting mic - " + e.message, "system-msg");
                stopListening();
            }
        }
    });

    function stopListening() {
        isListening = false;
        micBtn.innerText = "🎤 TAP TO SPEAK";
        micBtn.classList.remove('listening');
        waveContainer.classList.remove('active', 'speaking');
        setStatus("Ready");
    }

    function addMessage(text, className) {
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message ' + className;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // --- XAI (GROK) API INTEGRATION ---
    async function sendToGrok(userText) {
        setStatus("AI is thinking...");
        addMessage("AI: Thinking...", "system-msg");
        
        const prompt = `
        You are a voice assistant. Analyze the user's request and respond in strict JSON format ONLY. Do not add any other text.
        If the user wants to open an app and search (e.g., "open YouTube and search Mr beast"), respond:
        {"action": "search", "app": "youtube", "query": "Mr beast"}
        
        If the user just wants to open a website/app:
        {"action": "open", "app": "youtube"}
        
        If the user is just asking a question:
        {"action": "chat", "response": "your response here"}
        
        User request: ${userText}
        `;

        try {
            const response = await fetch(`https://api.x.ai/v1/chat/completions`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + apiKey 
                },
                body: JSON.stringify({
                    // Using Grok Beta model
                    model: "grok-beta", 
                    messages: [{ role: "user", content: prompt }]
                })
            });
            
            const data = await response.json();
            
            if (data.error) {
                setStatus("API Error");
                addMessage("AI: API Error - " + data.error.message, "ai-msg");
                return;
            }

            const rawText = data.choices[0].message.content;
            let cleanJson = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
            const aiData = JSON.parse(cleanJson);
            
            executeAction(aiData);
        } catch (error) {
            setStatus("Connection Error");
            addMessage("AI: Error connecting to Grok.", "system-msg");
            console.error(error);
        }
    }

    function executeAction(data) {
        const action = data.action;
        
        if (action === "search") {
            const app = data.app.toLowerCase();
            const query = encodeURIComponent(data.query);
            
            if (app === "youtube") {
                setStatus("Opening YouTube App...");
                window.location.href = `youtube://search?q=${query}`;
                addMessage(`AI: Opening YouTube app and searching for '${data.query}'.`, "ai-msg");
            } else if (app === "google") {
                setStatus("Searching Google...");
                window.open(`https://www.google.com/search?q=${query}`, "_blank");
                addMessage(`AI: Searched Google for '${data.query}'.`, "ai-msg");
            }
        } else if (action === "open") {
            const app = data.app.toLowerCase();
            
            if (app === "youtube") {
                setStatus("Opening YouTube App...");
                window.location.href = `youtube://`;
                addMessage(`AI: Opening YouTube app.`, "ai-msg");
            } else if (app === "google") {
                window.open("https://google.com", "_blank");
            } else {
                setStatus("Unknown App");
                addMessage(`AI: I don't know how to open ${app}.`, "ai-msg");
            }
        } else if (action === "chat") {
            setStatus("AI Responded");
            addMessage("AI: " + data.response, "ai-msg");
        }
        
        setTimeout(() => { setStatus("Ready"); }, 3000);
    }
</script>

</body>
</html>
