<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECHO — Voice Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d12;
    --bg-2:#0f141c;
    --panel:#131922;
    --line:#1e2733;
    --teal:#4fd1c5;
    --teal-dim:#2a5a54;
    --coral:#ff6b4a;
    --violet:#8b7cf6;
    --text:#e7ecf2;
    --text-dim:#7c8898;
    --text-faint:#4a5563;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, #101826 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 50% 100%, #0d1a1a 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
  }
  /* subtle grain */
  body::before{
    content:'';
    position:fixed;inset:0;
    background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,0.025) 1px, transparent 0);
    background-size:22px 22px;
    pointer-events:none;
    z-index:1;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 28px;
    z-index:5;
    border-bottom:1px solid var(--line);
    background:rgba(10,13,18,0.6);
    backdrop-filter:blur(12px);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:18px;
    letter-spacing:0.02em;
  }
  .brand .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--teal);
    box-shadow:0 0 10px var(--teal);
  }
  .brand small{
    display:block;
    font-family:'JetBrains Mono',monospace;
    font-weight:400;
    font-size:10px;
    color:var(--text-faint);
    letter-spacing:0.15em;
    margin-top:1px;
  }
  .status-pill{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.05em;
    color:var(--text-dim);
    padding:6px 12px;
    border:1px solid var(--line);
    border-radius:100px;
    display:flex;
    align-items:center;
    gap:7px;
  }
  .status-pill .led{
    width:6px;height:6px;border-radius:50%;
    background:var(--text-faint);
    transition:all .3s ease;
  }
  .status-pill.live .led{background:var(--teal);box-shadow:0 0 8px var(--teal);}
  .status-pill.speaking .led{background:var(--coral);box-shadow:0 0 8px var(--coral);}

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    z-index:5;
    padding:20px;
    gap:28px;
  }

  .stage{
    position:relative;
    width:min(320px,60vw);
    height:min(320px,60vw);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  canvas#orb{
    width:100%;
    height:100%;
  }
  .core-label{
    position:absolute;
    bottom:-6px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.2em;
    color:var(--text-faint);
    text-transform:uppercase;
    pointer-events:none;
    transition:opacity .3s ease;
  }

  .transcript-line{
    max-width:640px;
    width:100%;
    text-align:center;
    min-height:64px;
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(16px,3vw,22px);
    font-weight:500;
    line-height:1.4;
    color:var(--text);
    padding:0 16px;
  }
  .transcript-line.dim{color:var(--text-dim);font-weight:400;}
  .transcript-line .cursor{
    display:inline-block;
    width:2px;height:1em;
    background:var(--teal);
    vertical-align:middle;
    animation:blink 1s step-end infinite;
    margin-left:2px;
  }
  @keyframes blink{50%{opacity:0;}}

  .controls{
    display:flex;
    align-items:center;
    gap:18px;
  }
  .mic-btn{
    width:64px;height:64px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--panel);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:all .25s ease;
    position:relative;
  }
  .mic-btn:hover{border-color:var(--teal-dim);}
  .mic-btn.active{
    background:linear-gradient(160deg,var(--teal),#2fa89a);
    border-color:var(--teal);
    box-shadow:0 0 24px rgba(79,209,197,0.35);
  }
  .mic-btn svg{width:24px;height:24px;stroke:var(--text);transition:stroke .2s;}
  .mic-btn.active svg{stroke:#06110f;}
  .mic-btn.disabled{opacity:0.4;cursor:not-allowed;}

  .text-fallback{
    display:flex;
    gap:8px;
    align-items:center;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:100px;
    padding:6px 6px 6px 18px;
    width:min(420px,80vw);
  }
  .text-fallback input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14px;
  }
  .text-fallback input::placeholder{color:var(--text-faint);}
  .text-fallback button{
    background:var(--teal-dim);
    border:none;
    color:var(--teal);
    width:34px;height:34px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .text-fallback button:hover{background:var(--teal);color:#06110f;}
  .text-fallback button svg{width:15px;height:15px;}

  footer{
    text-align:center;
    padding:14px;
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:0.1em;
    color:var(--text-faint);
    z-index:5;
  }
  .hint{color:var(--text-faint);font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:0.05em;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<header>
  <div class="brand">
    <span class="dot"></span>
    <div>ECHO<small>VOICE INTELLIGENCE · 01</small></div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <button id="keyBtn" title="Set API key" style="background:transparent;border:1px solid var(--line);border-radius:100px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim);">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
    <div class="status-pill" id="statusPill"><span class="led"></span><span id="statusText">IDLE</span></div>
  </div>
</header>

<div id="keyModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:50;align-items:center;justify-content:center;padding:24px;">
  <div style="background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:420px;width:100%;">
    <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;margin-bottom:8px;">Z.ai API key</div>
    <div style="color:var(--text-dim);font-size:13px;line-height:1.5;margin-bottom:14px;">Get a key at <span style="color:var(--teal);">z.ai</span> → profile icon → API Keys → Create new key. Saved only on this device.</div>
    <input id="keyInput" type="password" placeholder="paste your Z.ai key" style="width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;margin-bottom:14px;">
    <div style="display:flex;gap:10px;">
      <button id="keySave" style="flex:1;background:var(--teal);color:#06110f;border:none;border-radius:8px;padding:10px;font-weight:600;cursor:pointer;">Save</button>
      <button id="keyCancel" style="background:transparent;color:var(--text-dim);border:1px solid var(--line);border-radius:8px;padding:10px 16px;cursor:pointer;">Cancel</button>
    </div>
  </div>
</div>

<main>
  <div class="stage">
    <canvas id="orb" width="640" height="640"></canvas>
    <div class="core-label" id="coreLabel">TAP TO SPEAK</div>
  </div>

  <div class="transcript-line dim" id="transcript">Say something — I'm listening whenever you tap the mic.</div>

  <div class="controls">
    <button class="mic-btn" id="micBtn" title="Start listening">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </button>
  </div>

  <div class="text-fallback">
    <input type="text" id="textInput" placeholder="…or type here instead" />
    <button id="sendBtn" title="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</main>

<footer class="hint">TRY: "OPEN YOUTUBE AND SEARCH MINECRAFT" · "GO TO REDDIT.COM"</footer>

<script>
// ---------- 3D Avatar ----------
const canvas = document.getElementById('orb');
let state = 'idle'; // idle | listening | thinking | speaking
let amp = 0;        // 0..1 smoothed amplitude, drives mouth openness while speaking
let targetAmp = 0;
let t = 0;

const stateColorsHex = {
  idle:      { core: 0x2a5a54, glow: 0x2a5a54, mouth: 0x1a3530 },
  listening: { core: 0x4fd1c5, glow: 0x4fd1c5, mouth: 0x2fa89a },
  thinking:  { core: 0x8b7cf6, glow: 0x8b7cf6, mouth: 0x5a4bc4 },
  speaking:  { core: 0xff6b4a, glow: 0xff6b4a, mouth: 0xc94a2f }
};

const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
camera.position.set(0, 0, 6.4);

const ambient = new THREE.AmbientLight(0xffffff, 0.55);
scene.add(ambient);
const keyLight = new THREE.PointLight(0x4fd1c5, 1.4, 20);
keyLight.position.set(3, 3, 5);
scene.add(keyLight);
const rimLight = new THREE.PointLight(0xff6b4a, 0.8, 20);
rimLight.position.set(-3, -2, 3);
scene.add(rimLight);

const headGroup = new THREE.Group();
scene.add(headGroup);

// Face — rounded humanoid head (skin-toned, soft shading like an anime bust)
const faceGeo = new THREE.SphereGeometry(1.25, 48, 48);
faceGeo.scale(0.92, 1.05, 0.95);
const faceMat = new THREE.MeshStandardMaterial({
  color: 0xf3c9a8, roughness: 0.65, metalness: 0.05,
  emissive: 0x2a5a54, emissiveIntensity: 0.08
});
const face = new THREE.Mesh(faceGeo, faceMat);
headGroup.add(face);

// Jaw taper — subtle chin narrowing via a secondary lower sphere blended in
const jawGeo = new THREE.SphereGeometry(1.0, 32, 32);
jawGeo.scale(0.82, 0.62, 0.86);
const jaw = new THREE.Mesh(jawGeo, faceMat);
jaw.position.set(0, -0.62, 0.12);
headGroup.add(jaw);

// Hair — dark tousled cap made of overlapping deformed spheres (low-poly anime hair look)
const hairMat = new THREE.MeshStandardMaterial({ color: 0x14161c, roughness: 0.5, metalness: 0.15 });
const hairCap = new THREE.Mesh(new THREE.SphereGeometry(1.32, 32, 32, 0, Math.PI*2, 0, Math.PI*0.62), hairMat);
hairCap.position.set(0, 0.14, -0.05);
headGroup.add(hairCap);
const hairTufts = [
  { p: [-0.55, 0.95, 0.75], s: 0.34 },
  { p: [0.5, 1.0, 0.7], s: 0.3 },
  { p: [0.0, 1.15, 0.55], s: 0.36 },
  { p: [-0.95, 0.55, 0.35], s: 0.28 },
  { p: [0.95, 0.5, 0.3], s: 0.26 },
  { p: [0.15, 1.05, -0.5], s: 0.4 }
];
hairTufts.forEach(({p,s}) => {
  const tuft = new THREE.Mesh(new THREE.SphereGeometry(s, 12, 12), hairMat);
  tuft.position.set(...p);
  tuft.scale.set(1, 1.3, 0.9);
  headGroup.add(tuft);
});

// Soft rim glow shell (keeps ECHO's reactive-color signature without hiding the face)
const shellGeo = new THREE.SphereGeometry(1.5, 24, 24);
const shellMat = new THREE.MeshBasicMaterial({ color: 0x4fd1c5, wireframe: true, transparent: true, opacity: 0.1 });
const shell = new THREE.Mesh(shellGeo, shellMat);
headGroup.add(shell);

// Eyes — iris + white, anime-style, angled slightly for a friendly look
function makeEye(x){
  const group = new THREE.Group();
  const white = new THREE.Mesh(new THREE.SphereGeometry(0.16, 20, 20), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 }));
  const iris = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 16), new THREE.MeshStandardMaterial({ color: 0x3a5fd9, emissive: 0x4fd1c5, emissiveIntensity: 0.9, roughness: 0.2 }));
  iris.position.z = 0.1;
  group.add(white, iris);
  group.position.set(x, 0.22, 1.05);
  group.userData.iris = iris;
  return group;
}
const eyeL = makeEye(-0.4);
const eyeR = makeEye(0.4);
headGroup.add(eyeL, eyeR);

// Eyebrows — thin dark boxes for expression
const browMat = new THREE.MeshStandardMaterial({ color: 0x14161c });
const browL = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.045, 0.05), browMat);
const browR = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.045, 0.05), browMat);
browL.position.set(-0.4, 0.44, 1.14);
browR.position.set(0.4, 0.44, 1.14);
headGroup.add(browL, browR);

// Mouth — scales vertically for lip sync while speaking
const mouthGeo = new THREE.BoxGeometry(0.4, 0.08, 0.1, 1, 1, 1);
const mouthMat = new THREE.MeshStandardMaterial({ color: 0xb5554a, roughness: 0.5 });
const mouth = new THREE.Mesh(mouthGeo, mouthMat);
mouth.position.set(0, -0.38, 1.14);
headGroup.add(mouth);


function resizeCanvas(){
  const rect = canvas.getBoundingClientRect();
  renderer.setSize(rect.width, rect.height, false);
  camera.aspect = rect.width / rect.height;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resizeCanvas);
setTimeout(resizeCanvas, 50);

let blinkTimer = 2 + Math.random()*3;
let blinkPhase = 0; // 0 = open

function animate(){
  requestAnimationFrame(animate);
  t += 0.016;
  amp += (targetAmp - amp) * 0.2;

  const colors = stateColorsHex[state];
  face.material.emissive.setHex(colors.core);
  shell.material.color.setHex(colors.glow);
  keyLight.color.setHex(colors.glow);
  eyeL.userData.iris.material.emissive.setHex(colors.glow);
  eyeR.userData.iris.material.emissive.setHex(colors.glow);

  // idle life: gentle bob + rotation
  headGroup.rotation.y = Math.sin(t*0.5) * 0.18 + (state==='thinking' ? Math.sin(t*2)*0.08 : 0);
  headGroup.rotation.x = Math.sin(t*0.4) * 0.06;
  headGroup.position.y = Math.sin(t*0.8) * 0.06;

  // thinking pulse (subtle scale breathing on the whole head)
  const thinkPulse = state === 'thinking' ? (Math.sin(t*4)*0.03 + 1) : 1;
  face.scale.setScalar(thinkPulse);
  shell.scale.setScalar(1 + amp*0.06);

  // mouth: only animates while actually speaking
  const mouthTarget = state === 'speaking' ? (0.15 + amp*2.0) : 0.15;
  mouth.scale.y += (mouthTarget/0.15 - mouth.scale.y) * 0.35;
  mouth.scale.x = 1 + (state === 'speaking' ? amp*0.2 : 0);
  mouth.material.color.setHex(state === 'speaking' ? 0xc9614f : 0xb5554a);

  // blinking
  blinkTimer -= 0.016;
  if(blinkTimer <= 0 && blinkPhase === 0){
    blinkPhase = 1;
    blinkTimer = 2.5 + Math.random()*3.5;
  }
  if(blinkPhase === 1){
    eyeL.scale.y -= 0.35; eyeR.scale.y -= 0.35;
    if(eyeL.scale.y <= 0.08){ blinkPhase = 2; }
  } else if(blinkPhase === 2){
    eyeL.scale.y += 0.35; eyeR.scale.y += 0.35;
    if(eyeL.scale.y >= 1){ eyeL.scale.y = 1; eyeR.scale.y = 1; blinkPhase = 0; }
  }

  renderer.render(scene, camera);
}
animate();

// ---------- Speech setup ----------
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = document.getElementById('micBtn');
const statusPill = document.getElementById('statusPill');
const statusText = document.getElementById('statusText');
const coreLabel = document.getElementById('coreLabel');
const transcriptEl = document.getElementById('transcript');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');

let recognition = null;
let listening = false;
let audioCtx, analyser, micStream, micSource, rafId;
let conversation = []; // {role, content}

function setState(newState, label){
  state = newState;
  statusPill.className = 'status-pill' + (newState==='listening' ? ' live' : newState==='speaking' ? ' speaking' : '');
  statusText.textContent = label;
  coreLabel.textContent =
    newState==='idle' ? 'TAP TO SPEAK' :
    newState==='listening' ? 'LISTENING…' :
    newState==='thinking' ? 'THINKING…' : 'SPEAKING…';
}

function setTranscript(text, dim=false){
  transcriptEl.textContent = text;
  transcriptEl.className = 'transcript-line' + (dim ? ' dim' : '');
}

// simulated listening pulse (no longer grabs a second mic stream —
// that was competing with SpeechRecognition's own mic access and
// silently starving it of audio on some Android/Chrome builds)
function startAmplitudeAnalysis(){
  function tick(){
    targetAmp = 0.25 + Math.random()*0.35;
    rafId = requestAnimationFrame(tick);
  }
  tick();
}
function stopAmplitudeAnalysis(){
  if(rafId) cancelAnimationFrame(rafId);
  targetAmp = 0;
}

if(!SpeechRecognition){
  micBtn.classList.add('disabled');
  setTranscript('Voice recognition isn\'t supported in this browser — type below instead.', true);
} else {
  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  recognition.onstart = () => {
    listening = true;
    micBtn.classList.add('active');
    setState('listening','LISTENING');
    startAmplitudeAnalysis();
  };

  let pendingFinal = '';
  let debounceTimer = null;

  recognition.onresult = (e) => {
    let interim = '';
    let newFinal = '';
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal) newFinal += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    if(newFinal.trim()) pendingFinal += (pendingFinal ? ' ' : '') + newFinal.trim();
    setTranscript((pendingFinal + ' ' + interim).trim(), false);

    // Only act once the person has actually paused — a short gap between
    // final chunks doesn't necessarily mean the whole command is finished
    // (e.g. "open YouTube" [pause] "and search Minecraft" is one command).
    if(debounceTimer) clearTimeout(debounceTimer);
    if(pendingFinal){
      debounceTimer = setTimeout(() => {
        const toSend = pendingFinal.trim();
        pendingFinal = '';
        if(toSend) handleUserSpeech(toSend);
      }, 900);
    }
  };

  recognition.onerror = (e) => {
    console.warn('Recognition error', e.error);
    if(e.error === 'no-speech' || e.error === 'aborted') return;
    setTranscript('Mic error: ' + e.error + '. Try again or type instead.', true);
  };

  recognition.onend = () => {
    listening = false;
    micBtn.classList.remove('active');
    stopAmplitudeAnalysis();
    if(state === 'listening') setState('idle','IDLE');
    if(debounceTimer) clearTimeout(debounceTimer);
    if(pendingFinal.trim()){
      const toSend = pendingFinal.trim();
      pendingFinal = '';
      handleUserSpeech(toSend);
    }
  };
}

const synth = window.speechSynthesis || null;
const hasTTS = !!synth;

// ---------- API key handling (standalone mode) ----------
const keyModal = document.getElementById('keyModal');
const keyInput = document.getElementById('keyInput');
let apiKey = localStorage.getItem('echo_api_key') || '';

function openKeyModal(){
  keyInput.value = apiKey;
  keyModal.style.display = 'flex';
}
document.getElementById('keyBtn').addEventListener('click', openKeyModal);
document.getElementById('keyCancel').addEventListener('click', () => keyModal.style.display = 'none');
document.getElementById('keySave').addEventListener('click', () => {
  apiKey = keyInput.value.trim();
  localStorage.setItem('echo_api_key', apiKey);
  keyModal.style.display = 'none';
  setTranscript(apiKey ? 'Key saved. Try talking to ECHO now.' : 'Key cleared.', true);
});
// prompt on first load if no key yet
if(!apiKey) setTimeout(openKeyModal, 400);

micBtn.addEventListener('click', () => {
  if(!recognition) return;
  if(listening){
    recognition.stop();
  } else {
    if(hasTTS) synth.cancel();
    try{ recognition.start(); }catch(e){ /* already started */ }
  }
});

// ---------- Text fallback ----------
sendBtn.addEventListener('click', submitTextInput);
textInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') submitTextInput(); });
function submitTextInput(){
  const val = textInput.value.trim();
  if(!val) return;
  textInput.value = '';
  handleUserSpeech(val);
}

// ---------- Claude call ----------
// ---------- App launching / web search commands ----------
// Only apps/sites that expose a URL scheme can be opened from a web page —
// this is a hard browser security limit, not a missing feature.
const APP_SCHEMES = {
  'whatsapp': 'https://wa.me/',
  'youtube': 'https://www.youtube.com',
  'gmail': 'https://mail.google.com',
  'email': 'https://mail.google.com',
  'maps': 'https://maps.google.com',
  'google maps': 'https://maps.google.com',
  'instagram': 'https://www.instagram.com',
  'spotify': 'https://open.spotify.com',
  'play store': 'https://play.google.com/store',
  'calendar': 'https://calendar.google.com',
  'drive': 'https://drive.google.com',
  'google drive': 'https://drive.google.com',
  'twitter': 'https://twitter.com',
  'x': 'https://twitter.com',
  'facebook': 'https://www.facebook.com',
  'netflix': 'https://www.netflix.com',
  'amazon': 'https://www.amazon.com',
  'translate': 'https://translate.google.com',
  'google translate': 'https://translate.google.com',
  'photos': 'https://photos.google.com',
  'phone': 'tel:',
  'dialer': 'tel:',
  'sms': 'sms:',
  'messages': 'sms:'
};

function normalizeSpokenUrl(raw){
  // speech recognition often renders "dot" literally, and drops it sometimes too
  let s = raw.trim().toLowerCase()
    .replace(/\s+dot\s+/g, '.')
    .replace(/\s+slash\s+/g, '/')
    .replace(/\s+/g, '');
  return s;
}

function isLikelyDomain(s){
  // matches things like example.com, sub.example.co.in, example.com/path
  return /^[a-z0-9-]+(\.[a-z0-9-]+)+(\/[^\s]*)?$/i.test(s);
}

function toFullUrl(s){
  if(/^https?:\/\//i.test(s)) return s;
  return 'https://' + s;
}

// Site-specific search URLs — so "search X on Y" actually searches inside Y,
// not just opens Y's homepage.
const SITE_SEARCH_URLS = {
  'youtube': 'https://www.youtube.com/results?search_query=',
  'amazon': 'https://www.amazon.com/s?k=',
  'spotify': 'https://open.spotify.com/search/',
  'maps': 'https://www.google.com/maps/search/',
  'google maps': 'https://www.google.com/maps/search/',
  'play store': 'https://play.google.com/store/search?q=',
  'instagram': 'https://www.instagram.com/explore/search/keyword/?q=',
  'twitter': 'https://twitter.com/search?q=',
  'x': 'https://twitter.com/search?q=',
  'wikipedia': 'https://en.wikipedia.org/w/index.php?search=',
  'netflix': 'https://www.netflix.com/search?q=',
  'reddit': 'https://www.reddit.com/search/?q='
};

function executeSiteSearch(siteName, query){
  const key = siteName.trim().replace(/\s+app$/,'');
  const template = SITE_SEARCH_URLS[key];
  const url = template
    ? template + encodeURIComponent(query)
    : 'https://www.google.com/search?q=' + encodeURIComponent(query + ' ' + key);
  const win = window.open(url, '_blank');
  if(!win) return { reply: `I tried to search ${key} for ${query}, but the pop-up got blocked. Allow pop-ups for this page and try again.` };
  return { reply: template ? `Searching ${key} for ${query}.` : `I don't have a direct search for ${key}, so I googled ${query} on ${key} instead.` };
}

function tryExecuteCommand(rawText){
  const lower = rawText.toLowerCase().trim().replace(/[.!?]+$/,'').replace(/,/g, '');

  // Compound: "open youtube and search minecraft" (also tolerates "then"/no connector)
  const openAndSearchMatch = lower.match(/^open\s+(.+?)\s*(?:and\s+|then\s+)?search\s+(?:for\s+)?(.+)/);
  if(openAndSearchMatch){
    return executeSiteSearch(openAndSearchMatch[1], openAndSearchMatch[2]);
  }

  // Compound: "search minecraft on youtube" / "search for minecraft in youtube"
  const searchOnSiteMatch = lower.match(/^search\s+(?:for\s+)?(.+?)\s+(?:on|in)\s+(.+)/);
  if(searchOnSiteMatch){
    return executeSiteSearch(searchOnSiteMatch[2], searchOnSiteMatch[1]);
  }

  // Direct "go to <website>" / "open the website <x>" / "navigate to <x>"
  const gotoMatch = lower.match(/^(?:go to|navigate to|take me to|open the website)\s+(.+)/);
  if(gotoMatch){
    const candidate = normalizeSpokenUrl(gotoMatch[1]);
    const url = isLikelyDomain(candidate) ? toFullUrl(candidate) : 'https://www.google.com/search?q=' + encodeURIComponent(gotoMatch[1]);
    const win = window.open(url, '_blank');
    if(!win) return { reply: `I tried to open that, but the pop-up got blocked. Allow pop-ups for this page and try again.` };
    return { reply: isLikelyDomain(candidate) ? `Opening ${candidate}.` : `I searched for that since it wasn't a clear web address.` };
  }

  const searchMatch = lower.match(/^(?:google|search|search up|look up|search for)\s+(?:for\s+)?(.+)/);
  if(searchMatch){
    const q = searchMatch[1].trim();
    const win = window.open('https://www.google.com/search?q=' + encodeURIComponent(q), '_blank');
    if(!win) return { reply: `I tried to search for ${q}, but your browser blocked the pop-up. Allow pop-ups for this page and try again.` };
    return { reply: `Searching the web for ${q}.` };
  }

  const openMatch = lower.match(/^(?:open|launch|start)\s+(.+)/);
  if(openMatch){
    let target = openMatch[1].trim().replace(/\s+app$/,'');
    const scheme = APP_SCHEMES[target];
    if(scheme){
      const win = window.open(scheme, '_blank');
      if(!win) return { reply: `I tried to open ${target}, but the pop-up got blocked. Allow pop-ups for this page and try again.` };
      return { reply: `Opening ${target}.` };
    }
    // check if it's actually a website address before falling back to search
    const candidate = normalizeSpokenUrl(target);
    if(isLikelyDomain(candidate)){
      const win = window.open(toFullUrl(candidate), '_blank');
      if(!win) return { reply: `I tried to open ${candidate}, but the pop-up got blocked. Allow pop-ups for this page and try again.` };
      return { reply: `Opening ${candidate}.` };
    }
    // no known scheme or domain — search for it instead of failing silently
    window.open('https://www.google.com/search?q=' + encodeURIComponent(target), '_blank');
    return { reply: `I don't have a direct link for ${target}, so I searched it for you instead.` };
  }

  return null;
}

async function handleUserSpeech(text){
  const command = tryExecuteCommand(text);
  if(command){
    conversation.push({role:'user', content:text});
    conversation.push({role:'assistant', content:command.reply});
    if(hasTTS) speakReply(command.reply);
    else { setState('idle','IDLE'); setTranscript(command.reply, false); }
    return;
  }

  if(!apiKey){
    openKeyModal();
    setTranscript('Add your Z.ai API key first (gear icon, top right).', true);
    return;
  }
  setTranscript('“' + text + '”', false);
  setState('thinking','THINKING');
  conversation.push({role:'user', content:text});

  try{
    const response = await fetch(
      "https://api.z.ai/api/paas/v4/chat/completions",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + apiKey
        },
        body: JSON.stringify({
          model: "glm-5.2",
          messages: [
            { role: "system", content: "You are ECHO, a warm, sharp, concise voice assistant. You are being spoken aloud via text-to-speech, so: keep replies short (1-3 sentences unless asked for more), avoid markdown, bullet points, asterisks, or any formatting that doesn't sound natural read aloud, and speak like a real conversation, not an essay." },
            ...conversation
          ],
          max_tokens: 300
        })
      }
    );
    if(!response.ok){
      const errData = await response.json().catch(()=>({}));
      throw new Error(errData?.error?.message || ('HTTP ' + response.status));
    }
    const data = await response.json();
    const reply = data?.choices?.[0]?.message?.content?.trim() || "Sorry, I didn't catch that.";
    conversation.push({role:'assistant', content:reply});
    if(hasTTS){
      speakReply(reply);
    } else {
      setState('idle','IDLE');
      setTranscript(reply, false);
    }
  }catch(err){
    console.error(err);
    setState('idle','IDLE');
    setTranscript('AI error: ' + (err.message || 'could not reach the AI') + '. Check your API key (gear icon).', true);
  }
}

function speakReply(text){
  if(!hasTTS){
    setState('idle','IDLE');
    setTranscript(text, false);
    return;
  }
  setTranscript(text, false);
  setState('speaking','SPEAKING');
  synth.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 1.02;
  utter.pitch = 1.0;

  // try to pick a natural-sounding voice
  const voices = synth.getVoices();
  const preferred = voices.find(v => /Google US English|Samantha|Aria|Natural/i.test(v.name)) || voices.find(v => v.lang === 'en-US');
  if(preferred) utter.voice = preferred;

  // amplitude driven by real word boundaries, with a light random flutter
  // between words so the mouth doesn't look mechanically flat
  let speakingRaf;
  let boundaryPulse = 0;
  function fakeAmp(){
    boundaryPulse *= 0.82; // decay after each word hit
    targetAmp = Math.min(1, boundaryPulse + Math.random()*0.15);
    speakingRaf = requestAnimationFrame(fakeAmp);
  }
  fakeAmp();
  utter.onboundary = (e) => {
    if(e.name === 'word' || e.name === undefined){
      boundaryPulse = 0.55 + Math.random()*0.45;
    }
  };

  utter.onend = () => {
    cancelAnimationFrame(speakingRaf);
    targetAmp = 0;
    setState('idle','IDLE');
    setTranscript('Say something — I\'m listening whenever you tap the mic.', true);
  };
  utter.onerror = () => {
    cancelAnimationFrame(speakingRaf);
    targetAmp = 0;
    setState('idle','IDLE');
  };
  synth.speak(utter);
}

// warm up voice list (Chrome loads async)
if(hasTTS){
  synth.onvoiceschanged = () => synth.getVoices();
} else {
  setTranscript('Voice output isn\'t supported in this browser — replies will show as text instead.', true);
}
</script>
